<!doctype html>
<html><body style="margin:0;overflow:hidden">
<script type="module">
  import * as THREE from '/lib/three.module.js'

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
  renderer.setSize(innerWidth, innerHeight)
  document.body.append(renderer.domElement)
  const gl = renderer.getContext()
  if (!(gl instanceof WebGL2RenderingContext)) throw new Error('Blockout requires WebGL 2')
  renderer.domElement.addEventListener('webglcontextlost', () => { throw new Error('Blockout WebGL context lost') })

  const scene = new THREE.Scene()
  scene.background = new THREE.Color('#c5d0da')
  scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 3))
  const material = new THREE.MeshStandardMaterial({ color: '#80858a', roughness: 1 })
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), material)
  ground.rotation.x = -Math.PI / 2
  scene.add(ground)
  for (const x of [-1.4, 1.4]) {
    const person = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 1, 6, 12), material)
    person.position.set(x, 0.85, 0)
    scene.add(person)
  }
  const box = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.8), material)
  box.position.set(0, 0.4, 0.5)
  scene.add(box)

  // Readiness includes textures so seek never races image decoding on another platform.
  const loader = new THREE.TextureLoader()
  const textures = await Promise.all([loader.loadAsync('/input/0'), loader.loadAsync('/input/1')])
  textures.forEach((map, index) => {
    map.colorSpace = THREE.SRGBColorSpace
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 1.2), new THREE.MeshBasicMaterial({ map, side: THREE.DoubleSide }))
    plane.position.set(index === 0 ? -1.6 : 1.6, 1.4, -1.3)
    scene.add(plane)
  })
  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100)
  window.vis = {
    duration: 1,
    seek(t) {
      if (!(renderer.getContext() instanceof WebGL2RenderingContext) || gl.isContextLost()) throw new Error('Blockout requires an active WebGL 2 context')
      camera.position.set(4 - t * 3, 2.7, 6 - t)
      camera.lookAt(0, 0.9, 0)
      renderer.render(scene, camera)
    },
  }
</script>
</body></html>
