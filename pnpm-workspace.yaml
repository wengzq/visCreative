packages:
  - apps/*
  - services/*
  - packages/*
  - packages/canvas/*
  - packages/timeline/*
  - packages/previz/*
  - packages/scene/*
  - packages/writing/*
  - packages/library/*
  - packages/workbench/*

supportedArchitectures:
  os:
    - darwin
    - linux
    - win32
  cpu:
    - x64
    - arm64

# pnpm 10 默认不执行依赖的构建脚本；better-sqlite3 需要原生构建或下载预编译包
onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - esbuild
